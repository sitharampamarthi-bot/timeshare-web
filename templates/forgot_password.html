<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f2ff;">

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">

    <div class="card shadow p-4" style="max-width:500px;width:100%;border-radius:25px;">

        <h2 class="text-center fw-bold mb-2">Forgot Password</h2>
        <p class="text-center text-muted">Enter mobile number or email</p>

        <form method="POST">

            <div class="mb-3">
                <label>Mobile Number</label>
                <input type="text" name="mobile" class="form-control" placeholder="Enter mobile number">
            </div>

            <div class="text-center text-muted mb-2">OR</div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email">
            </div>

            {% if message %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
            {% endif %}

            <button class="btn btn-primary w-100">
                Continue
            </button>

            <div class="text-center mt-3">
                <a href="/">Back to Login</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>

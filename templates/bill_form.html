<!DOCTYPE html>
<html>
<head>
    <title>{% if bill %}Edit Bill{% else %}Add Bill{% endif %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6f42c1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f2ff;">

<div class="container p-4">

    <div class="card shadow border-0 p-4" style="border-radius:22px;max-width:800px;margin:auto;">

        <h2 class="fw-bold mb-4">
            {% if bill %}Edit Bill{% else %}Add Bill{% endif %}
        </h2>

        <form method="POST" enctype="multipart/form-data">

            <div class="row g-3">

                <div class="col-md-6">
                    <label>Date</label>
                    <input type="date" name="date" class="form-control"
                        value="{{ bill.date if bill else '' }}" required>
                </div>

                <div class="col-md-6">
                    <label>ID No</label>
                    <input type="text" name="idNo" id="idNo" class="form-control"
                        value="{{ bill.idNo if bill else '' }}" required>
                </div>

                <div class="col-md-6">
                    <label>Receipt No</label>
                    <input type="text" name="receiptNo" class="form-control"
                           value="{{ bill.receiptNo if bill else '' }}" required>
                </div>

                <div class="col-md-6">
                    <label>Member Name</label>
                    <input type="text" name="memberName" id="memberName" class="form-control"
                        value="{{ bill.memberName if bill else '' }}" required>
                </div>

                <div class="col-md-6">
                    <label>Mobile No</label>
                    <input type="text" name="mobileNo" id="mobileNo" class="form-control"
                        value="{{ bill.mobileNo if bill else '' }}">
                </div>

                <div class="col-md-6">
                    <label>Paid Amount</label>
                    <input type="number" name="paidAmount" class="form-control"
                           value="{{ bill.paidAmount if bill else '' }}" required>
                </div>

                <div class="col-md-6">
                    <label>Payment Mode</label>
                    <input type="text" name="paymentMode" class="form-control"
                           value="{{ bill.paymentMode if bill else '' }}">
                </div>

                <div class="col-md-6">
                    <label>Executive Name</label>
                    <input type="text" name="executiveName" class="form-control"
                           value="{{ bill.executiveName if bill else '' }}">
                </div>

                <div class="col-md-12">
                    <label>Remarks</label>
                    <textarea name="remarks" class="form-control">{{ bill.remarks if bill else '' }}</textarea>
                </div>
                <div class="col-md-12">
                    <label>Images / PDF Documents</label>
                    <input type="file" name="files" class="form-control" multiple accept="image/*,.pdf"><input type="file"
                            name="files"
                            class="form-control"
                            multiple
                            accept="image/*,.pdf"
                            capture="environment">
                </div>

                {% if bill and bill.files %}
                <div class="col-md-12 mt-3">
                    <label>Existing Files</label>
                    <div class="d-flex gap-3 flex-wrap">

                        {% for f in bill.files %}
                        <div style="position:relative;">

                            {% if 'image' in f.type %}
                                <a href="{{ f.url }}" target="_blank">
                                    <img src="{{ f.url }}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;">
                                </a>
                            {% else %}
                                <a href="{{ f.url }}" target="_blank" class="btn btn-outline-danger btn-sm">
                                    PDF
                                </a>
                            {% endif %}

                            <a href="/remove-file/{{ bill.docId }}/{{ loop.index0 }}"
                                onclick="return confirm('Remove this file?')"
                                style="position:absolute;top:-10px;right:-10px;background:red;color:white;border-radius:50%;width:24px;height:24px;text-align:center;text-decoration:none;">
                                ×
                            </a>

                        </div>
                        {% endfor %}

                    </div>
                </div>
                {% endif %}

            </div>
            {% if error %}
            <div class="alert alert-danger mt-3">
                {{ error }}
            </div>
            {% endif %}

            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary">Save</button>
                <a href="/bills" class="btn btn-secondary">Cancel</a>
            </div>

        </form>

    </div>

</div>
<script>
document.getElementById("idNo").addEventListener("blur", function(){
    let idNo = this.value.trim();

    if(idNo.length === 0) return;

    fetch("/get-member/" + encodeURIComponent(idNo))
        .then(res => res.json())
        .then(data => {
            if(data.found){
                document.getElementById("memberName").value = data.memberName;
                document.getElementById("mobileNo").value = data.mobileNo;
            }
        });
});
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/service-worker.js");
}
</script>

</body>
</html>

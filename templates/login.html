<!DOCTYPE html>
<html>
<head>
    <title>Timeshare Login</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6f42c1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            min-height:100vh;
            background:linear-gradient(135deg,#f7f2ff,#efe7ff,#ffffff);
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Arial, sans-serif;
        }

        .login-card{
            width:100%;
            max-width:430px;
            background:white;
            border-radius:26px;
            padding:35px;
            box-shadow:0 20px 45px rgba(111,66,193,0.18);
        }

        .logo-box{
            width:80px;
            height:80px;
            border-radius:22px;
            background:#6f42c1;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
            margin:auto;
            margin-bottom:18px;
        }

        .title{
            font-weight:800;
            color:#222;
        }

        .form-control{
            height:52px;
            border-radius:14px;
        }

        .btn-login{
            height:52px;
            border-radius:14px;
            background:#6f42c1;
            border:none;
            font-weight:700;
        }

        .btn-login:hover{
            background:#5a32a3;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo-box">
        <i class="bi bi-buildings"></i>
    </div>

    <div class="text-center mb-4">
        <h2 class="title">Timeshare App</h2>
        <p class="text-muted mb-0">Admin Login</p>
    </div>    

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Mobile Number / Email</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-phone"></i>
                </span>
                <input type="text" name="login_id" class="form-control" placeholder="Enter mobile number or email">
                </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" name="password" class="form-control" placeholder="Enter password">
            </div>
        </div>
        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <button class="btn btn-primary btn-login w-100">
            Login
        </button>
        <div class="text-center mt-2">
            <a href="/forgot-password"
                class="text-danger text-decoration-none">
                Forgot Password?
            </a>
        </div>
    </form>
    <div class="text-center mt-3">
        <a href="/signup" class="text-decoration-none">
         New user? Create account
        </a>
    </div>

</div>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/service-worker.js");
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Refund Bill</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f2ff;">

<div class="container p-4">
    <div class="card shadow border-0 p-4" style="border-radius:22px;max-width:850px;margin:auto;">

        <h2 class="fw-bold mb-4">Refund Bill</h2>

        <div class="row g-3 mb-4">
            <div class="col-md-6"><b>Date:</b> {{ bill.date }}</div>
            <div class="col-md-6"><b>ID No:</b> {{ bill.idNo }}</div>
            <div class="col-md-6"><b>Receipt No:</b> {{ bill.receiptNo }}</div>
            <div class="col-md-6"><b>Member:</b> {{ bill.memberName }}</div>
            <div class="col-md-6"><b>Mobile:</b> {{ bill.mobileNo }}</div>
            <div class="col-md-6"><b>Paid Amount:</b> ₹{{ bill.paidAmount }}</div>
        </div>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label>Refund Amount</label>
                <input type="number" name="refundAmount" class="form-control"
                       value="{{ bill.paidAmount }}" required>
            </div>
            <div class="mb-3">
                <label>Refund Date</label>
                <input type="date" name="refundDate" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Mode of Pay</label>
                <select name="refundPaymentMode" class="form-control" required>
                    <option value="">Select payment mode</option>
                    <option value="Cash">Cash</option>
                    <option value="PhonePe">PhonePe</option>
                    <option value="GPay">GPay</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Cheque">Cheque</option>
                    <option value="Online">Online</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Upload Refund Document / Image</label>
                <input type="file" name="files" class="form-control" multiple accept="image/*,.pdf">
            </div>

            <div class="mb-3">
                <label>Cancel / Refund Reason</label>
                <textarea name="reason" class="form-control" required></textarea>
            </div>

            <div class="mb-3">
                <label>Remarks</label>
                <textarea name="remarks" class="form-control"></textarea>
            </div>

            <button class="btn btn-danger">Confirm Refund</button>
            <a href="/bills" class="btn btn-secondary">Cancel</a>

        </form>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f2ff;">

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">

    <div class="card shadow p-4" style="max-width:500px;width:100%;border-radius:25px;">

        <h2 class="text-center fw-bold mb-2">Reset Password</h2>
        <p class="text-center text-muted">Enter your new password</p>

        <form method="POST">

            <div class="mb-3">
                <label>New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
            </div>

            <div class="mb-3">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
            </div>

            {% if message %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
            {% endif %}

            <button class="btn btn-primary w-100">
                Update Password
            </button>

            <div class="text-center mt-3">
                <a href="/">Back to Login</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
